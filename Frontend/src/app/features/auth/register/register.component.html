<div class="pagina-registro">
    <div class="tarjeta-registro">
        <div class="contenido-registro">

            <div class="columna-izquierda">
                <form class="formulario-registro" [formGroup]="formularioRegistro" (ngSubmit)="onSubmit()">

                    <div class="grupo-formulario">
                        <label for="nombre" class="visually-hidden">Nombre</label>
                        <input type="text" id="nombre" formControlName="nombre" placeholder="introduzca el nombre"
                            class="control-formulario" aria-describedby="nombre-error">
                        <!-- Muestro error si el nombre está vacío -->
                        <small id="nombre-error" role="alert"
                            *ngIf="formularioRegistro.get('nombre')?.invalid && formularioRegistro.get('nombre')?.touched"
                            style="color: red; font-size: 0.8em; display: block; margin-top: 5px;">
                            Nombre obligatorio
                        </small>
                    </div>

                    <div class="grupo-formulario">
                        <label for="apellidos" class="visually-hidden">Apellidos</label>
                        <input type="text" id="apellidos" formControlName="apellidos"
                            placeholder="Introduzcan los apellidos" class="control-formulario">
                    </div>

                    <div class="grupo-formulario">
                        <label for="email" class="visually-hidden">Correo electrónico</label>
                        <input type="email" id="email" formControlName="email" placeholder="Correo electronico"
                            class="control-formulario" aria-describedby="email-error">
                        <small id="email-error" role="alert"
                            *ngIf="formularioRegistro.get('email')?.invalid && formularioRegistro.get('email')?.touched"
                            style="color: red; font-size: 0.8em; display: block; margin-top: 5px;">
                            Email inválido
                        </small>
                    </div>

                    <div class="grupo-formulario">
                        <label for="password" class="visually-hidden">Contraseña</label>
                        <input type="password" id="password" formControlName="password" placeholder="Contraseña"
                            class="control-formulario">
                    </div>

                    <div class="grupo-formulario">
                        <label for="confirmPassword" class="visually-hidden">Repetir contraseña</label>
                        <input type="password" id="confirmPassword" formControlName="confirmPassword"
                            placeholder="Repita contraseña" class="control-formulario">
                    </div>

                    <div class="grupo-formulario">
                        <label for="pais" class="visually-hidden">País</label>
                        <input type="text" id="pais" formControlName="pais" placeholder="Pais"
                            class="control-formulario">
                    </div>

                    <div class="acciones-registro">
                        <button type="submit" class="boton-confirmar"
                            [disabled]="formularioRegistro.invalid">confirmar</button>
                    </div>

                    <div class="enlaces-extra">
                        <a routerLink="/login">Volver al Login</a>
                    </div>

                </form>
            </div>

            <div class="columna-derecha">
                <div class="circulo-perfil" aria-hidden="true">
                    <img src="assets/logo.png" alt=""
                        style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">
                </div>
            </div>

        </div>
    </div>
</div>
